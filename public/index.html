  <style type="text/css">
    body {
      margin: 0
    }

    .ipl-progress-indicator-head.custom.show {
      display: block;
    }

    .ipl-progress-indicator-head.custom {
      background-color: transparent;
      height: 3px;
      overflow: hidden;
      position: fixed;
      left: 0;
      right: 0;
      z-index: 10000;
      display: none;
    }

    .ipl-progress-indicator.available {
      display: none;
    }

    div.notification-container--top-right {
      right: 160px;
      top: 20px;
    }

    .ipl-progress-indicator {
      background-color: #fff;
      width: 100%;
      height: 100%;
      position: fixed;
      opacity: 1;
      pointer-events: none;
      -webkit-transition: opacity cubic-bezier(.4, 0, .2, 1) 436ms;
      -moz-transition: opacity cubic-bezier(.4, 0, .2, 1) 436ms;
      transition: opacity cubic-bezier(.4, 0, .2, 1) 436ms;
      z-index: 9999;
      overflow: hidden;
      top: 0px;
    }

    .insp-logo-frame {
      display: -webkit-flex;
      display: -moz-flex;
      display: flex;
      -webkit-flex-direction: column;
      -moz-flex-direction: column;
      flex-direction: column;
      -webkit-justify-content: center;
      -moz-justify-content: center;
      justify-content: center;
      -webkit-animation: fadein 436ms;
      -moz-animation: fadein 436ms;
      animation: fadein 436ms;
      height: 98%;
    }

    .insp-logo-frame>img {
      max-width: 250px;
      display: inline-block;
      align-self: center;
    }

    .insp-logo-frame-img {
      width: 112px;
      height: 112px;
      -webkit-align-self: center;
      -moz-align-self: center;
      align-self: center;
      border-radius: 50%;
    }

    .ipl-progress-indicator-head {
      background-color: transparent;
      height: 3px;
      overflow: hidden;
      position: relative;
    }

    .ipl-progress-indicator .first-indicator,
    .ipl-progress-indicator-head .first-indicator,
    .ipl-progress-indicator-head .second-indicator,
    .ipl-progress-indicator .second-indicator {
      background-color: #099209;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      position: absolute;
      -webkit-transform-origin: left center;
      -moz-transform-origin: left center;
      transform-origin: left center;
      -webkit-transform: scaleX(0);
      -moz-transform: scaleX(0);
      transform: scaleX(0);
    }

    .ipl-progress-indicator-head.custom .first-indicator,
    .ipl-progress-indicator-head.custom .second-indicator {
      background-color: var(--Primary);
    }

    .ipl-progress-indicator .first-indicator,
    .ipl-progress-indicator-head .first-indicator {
      -webkit-animation: first-indicator 2500ms linear infinite;
      -moz-animation: first-indicator 2500ms linear infinite;
      animation: first-indicator 2500ms linear infinite;
    }

    .ipl-progress-indicator .second-indicator,
    .ipl-progress-indicator-head .second-indicator {
      -webkit-animation: second-indicator 2500ms linear infinite;
      -moz-animation: second-indicator 2500ms linear infinite;
      animation: second-indicator 2500ms linear infinite;
    }

    .ipl-progress-indicator .insp-logo {
      animation: App-logo-spin infinite 20s linear;
      border-radius: 50%;
      -webkit-align-self: center;
      -moz-align-self: center;
      align-self: center;
    }

    @keyframes App-logo-spin {
      from {
        transform: rotate(0deg)
      }

      to {
        transform: rotate(360deg)
      }
    }

    @-webkit-keyframes fadein {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @-moz-keyframes fadein {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes fadein {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes first-indicator {
      0% {
        transform: translate(0%) scaleX(0)
      }

      25% {
        transform: translate(0%) scaleX(0.5)
      }

      50% {
        transform: translate(25%) scaleX(0.75)
      }

      75% {
        transform: translate(100%) scaleX(0)
      }

      100% {
        transform: translate(100%) scaleX(0)
      }
    }

    @keyframes second-indicator {
      0% {
        transform: translate(0%) scaleX(0)
      }

      60% {
        transform: translate(0%) scaleX(0)
      }

      80% {
        transform: translate(0%) scaleX(0.6)
      }

      100% {
        transform: translate(100%) scaleX(0.1)
      }
    }

    .loader {
      width: 300px;
      margin: 50px auto 0 auto;
      border-radius: 10px;
      border: none;
      position: relative;
      padding: 5px;
      background: #d4d4d4;
    }

    .loader .loaderBar {
      position: absolute;
      border-radius: 10px;
      top: 3px;
      background: var(--Primary);
      width: 50px;
      height: 4px;
      animation: borealisBar 1.5s linear infinite;
    }

    @keyframes borealisBar {
      0% {
        left: 0%;
        right: 100%;
        width: 0%;
      }

      10% {
        left: 0%;
        right: 75%;
        width: 25%;
      }

      90% {
        right: 0%;
        left: 75%;
        width: 25%;
      }

      100% {
        left: 100%;
        right: 0%;
        width: 0%;
      }
    }
  </style>
